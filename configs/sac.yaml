# Phase 2 — SAC on PickCube-v1 (CPU, single env).
# update_every=2 keeps UTD≈1 while spending more time in the simulator.
algo: sac
hidden_sizes: [256, 256]
gamma: 0.8
tau: 0.01
actor_lr: 3.0e-4
critic_lr: 3.0e-4
alpha_lr: 3.0e-4
batch_size: 256
buffer_size: 200000
total_timesteps: 80000
warmup_steps: 2000
updates_per_step: 1
update_every: 2
eval_episodes: 8
eval_freq: 20000
log_freq: 2000
seed: 0
checkpoint_dir: checkpoints
log_path: results/tables/sac_train_log.jsonl
best_path: checkpoints/sac_best.pt
final_path: checkpoints/sac_final.pt
